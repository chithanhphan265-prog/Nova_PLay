<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Cửa hàng game')}"></head>

<body>
    <div th:replace="~{fragments/layout :: header('store')}"></div>

    <main class="wrap">
        <div class="section">
            <h2>Cửa hàng game</h2>
            <p class="muted">Một thế giới mới đang chờ bạn.</p>
        </div>

        <form class="filters" th:action="@{/cua-hang}" method="get">
            <input type="text" name="q" th:value="${q}" aria-label="Tìm game" placeholder="Tìm tên game…">

            <select name="maTheLoai" aria-label="Thể loại" onchange="this.form.submit()">
                <option value="">Tất cả thể loại</option>
                <option th:each="tl : ${theLoais}"
                        th:value="${tl.maTheLoai}"
                        th:text="${tl.tenTheLoai}"
                        th:selected="${maTheLoai != null and maTheLoai == tl.maTheLoai}">Thể loại</option>
            </select>

            <select name="sort" aria-label="Sắp xếp" onchange="this.form.submit()">
                <option value="moi" th:selected="${sort == 'moi'}">Mới thêm</option>
                <option value="giaTang" th:selected="${sort == 'giaTang'}">Giá tăng dần</option>
                <option value="giaGiam" th:selected="${sort == 'giaGiam'}">Giá giảm dần</option>
                <option value="tenAZ" th:selected="${sort == 'tenAZ'}">Tên A → Z</option>
            </select>

            <div class="row" style="gap:8px; flex-wrap:nowrap;">
                <button type="submit">Tìm kiếm</button>
                <a class="btn" th:if="${(q != null and !q.isBlank()) or maTheLoai != null or (sort != null and sort != 'moi')}"
                   th:href="@{/cua-hang}">Đặt lại</a>
            </div>
        </form>

        <p class="muted" th:text="${gamePage.totalElements} + ' game'">0 game</p>

        <div class="empty" th:if="${gamePage.empty}">Không có game phù hợp.</div>

        <div class="grid" th:unless="${gamePage.empty}">
            <th:block th:each="g : ${gamePage.content}">
                <article th:replace="~{fragments/layout :: gameCard(${g})}"></article>
            </th:block>
        </div>

        <div class="pages" th:if="${totalPages > 1}">
            <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
               class="btn"
               th:classappend="${i == currentPage} ? 'primary'"
               th:href="@{/cua-hang(q=${q}, maTheLoai=${maTheLoai}, sort=${sort}, page=${i})}"
               th:text="${i + 1}">1</a>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>

</html>
