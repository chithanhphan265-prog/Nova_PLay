<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Thông báo hệ thống')}"></head>

<body>
    <div th:replace="~{fragments/layout :: header('home')}"></div>

    <main class="wrap">
        <div class="auth panel" style="text-align:center;">
            <span class="pill" th:text="'MÃ LỖI ' + ${errorCode != null ? errorCode : '500'}">LỖI</span>
            <h2 style="margin-top:18px;" th:text="${errorTitle != null ? errorTitle : 'Đã xảy ra sự cố'}">Sự cố</h2>
            <p class="muted" th:text="${errorDetail != null ? errorDetail : 'Vui lòng thử lại sau.'}">Chi tiết lỗi</p>
            <div class="row" style="justify-content:center; margin-top:20px;">
                <a class="btn primary" th:href="@{/trang-chu}">← Về trang chủ</a>
                <a class="btn" th:href="@{/cua-hang}">Về cửa hàng</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>

</html>
