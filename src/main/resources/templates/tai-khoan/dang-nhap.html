<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head>

<body>
    <div th:replace="~{fragments/layout :: header('login')}"></div>

    <main class="wrap">
        <div class="auth panel">
            <a class="logo" th:href="@{/trang-chu}">NOVA<b>PLAY</b></a>
            <h2 style="margin-top:22px">Chào mừng trở lại</h2>

            <div class="alert-box err" th:if="${loiChung != null}" th:text="${loiChung}"></div>

            <form th:action="@{/dang-nhap}" method="post" novalidate>
                <label for="username">Tên đăng nhập</label>
                <input id="username" name="tenDangNhap" th:value="${tenDangNhap}" required minlength="3" maxlength="40" autocomplete="username">
                <span class="field-error" th:if="${loiTenDangNhap != null}" th:text="${loiTenDangNhap}"></span>

                <label for="password">Mật khẩu thử nghiệm</label>
                <input id="password" name="matKhau" type="password" required minlength="6" autocomplete="off">
                <span class="field-error" th:if="${loiMatKhau != null}" th:text="${loiMatKhau}"></span>

                <button type="submit" class="primary full">Đăng nhập</button>
            </form>

            <p class="tiny muted" style="margin-top:14px;">Chỉ sử dụng tài khoản thử nghiệm của đồ án.</p>
            <a th:href="@{/dang-ky}">Chưa có tài khoản? Đăng ký</a>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>

</html>
